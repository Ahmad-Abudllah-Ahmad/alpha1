# Render — ADICC platform shell (TopNav + Estimation iframe → OpenTakeoff)
# OpenTakeoff stays on https://adicc.onrender.com; this service proxies /takeoff.

services:
  - type: web
    name: adicc-platform
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Direct embed of the live OpenTakeoff static site (assets at site root).
      - key: NEXT_PUBLIC_OPENTAKEOFF_URL
        value: https://adicc.onrender.com/
      - key: OPENTAKEOFF_ORIGIN
        value: https://adicc.onrender.com
